name: eigo_kore
description: "英語コレ！- リスニング・スピーキング特化の小学生英語学習アプリ"
publish_to: 'none'

version: 3.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  shared_core:
    path: ../shared_core
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.0
  intl: ^0.19.0
  confetti: ^0.8.0
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.4
  fl_chart: ^0.69.0
  in_app_purchase: ^3.2.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.0
  uuid: ^4.0.0
  http: ^1.1.0
  flutter_secure_storage: ^9.0.0
  google_generative_ai: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A73E8"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/legal/
    - assets/pets/
