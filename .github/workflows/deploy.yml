name: Build and Deploy APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      auto_tag:
        description: 'Auto-create version tag'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_success: ${{ steps.build_status.outputs.success }}
      app_version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get app version
        id: get_version
        run: |
          VERSION=$(grep "version:" pubspec.yaml | head -1 | sed 's/version: //g')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "App Version: $VERSION"

      - name: Clone shared_core
        run: |
          mkdir -p packages
          git clone https://github.com/zka32101/shared_core packages/shared_core

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          cache: true

      - name: Get Flutter version
        run: |
          flutter --version
          FLUTTER_SDK=$(which flutter | xargs dirname | xargs dirname)
          echo "FLUTTER_SDK=$FLUTTER_SDK" >> $GITHUB_ENV
          echo "Flutter SDK path: $FLUTTER_SDK"

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          cat android/local.properties

      - name: Get dependencies
        run: |
          rm -rf .dart_tool pubspec.lock
          flutter clean
          flutter pub get

      - name: Setup signing keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore
            ls -lh android/release.keystore
            echo "KEYSTORE_CONFIGURED=true" >> $GITHUB_ENV
          else
            echo "KEYSTORE_CONFIGURED=false" >> $GITHUB_ENV
          fi

      - name: Build APK
        id: build_apk
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee build_apk.log
          exit ${PIPESTATUS[0]}

      - name: Check Gradle configuration
        run: |
          echo "=== Android Gradle Config ==="
          cat android/app/build.gradle.kts 2>/dev/null || cat android/app/build.gradle 2>/dev/null || echo "No build.gradle found"
          echo ""
          echo "=== Keystore Info ==="
          ls -lh android/release.keystore 2>/dev/null || echo "No keystore file"

      - name: Build AAB
        id: build_aab
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build appbundle --release -v 2>&1 | tee build_aab.log
          BUILD_EXIT=$?
          echo "Build exit code: $BUILD_EXIT"
          exit $BUILD_EXIT

      - name: Set build status
        id: build_status
        run: |
          if [ "${{ steps.build_apk.outcome }}" = "success" ] && [ "${{ steps.build_aab.outcome }}" = "success" ]; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "✅ Build succeeded"
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "❌ Build failed"
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_apk.log
            build_aab.log
          retention-days: 30

      - name: List build outputs
        if: always()
        run: |
          echo "=== Checking build outputs ==="
          find build/app/outputs -type f 2>/dev/null || echo "No outputs directory"
          ls -lh build/app/outputs/apk/release/ 2>/dev/null || echo "No APK directory"
          ls -lh build/app/outputs/bundle/release/ 2>/dev/null || echo "No AAB directory"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Upload AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Setup Python for Google Drive upload
        if: always()
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Google Drive dependencies
        if: always()
        run: |
          pip install google-auth google-auth-httplib2 google-api-python-client

      - name: Upload to Google Drive
        if: success() && env.GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY != ''
        continue-on-error: true
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID || '1kqPMiEnGtF7sRNiYsds9_9YvuPsT1Rfu' }}
        run: |
          if [ -z "$GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY" ]; then
            echo "⚠️  Google Drive credentials not configured. Skipping upload."
            exit 0
          fi
          python scripts/upload_to_drive.py

  create_release:
    needs: build
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/apk-release/*
            artifacts/aab-release/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build status notification
        run: |
          if [ "${{ needs.build.outputs.build_success }}" = "true" ]; then
            echo "✅ Build v${{ needs.build.outputs.app_version }} succeeded!"
            echo "📦 Artifacts: APK and AAB ready for deployment"
          else
            echo "❌ Build v${{ needs.build.outputs.app_version }} failed!"
            echo "⚠️ Check logs for details"
          fi
