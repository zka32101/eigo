name: Build and Deploy APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Clone shared_core
        run: git clone https://github.com/zka32101/shared_core ../shared_core

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Get Flutter version
        run: |
          flutter --version
          FLUTTER_SDK=$(which flutter | xargs dirname | xargs dirname)
          echo "FLUTTER_SDK=$FLUTTER_SDK" >> $GITHUB_ENV
          echo "Flutter SDK path: $FLUTTER_SDK"

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          cat android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Gradle wrapper
        run: |
          cd android
          curl -sL https://services.gradle.org/distributions/gradle-8.14-bin.zip -o gradle-8.14-bin.zip
          unzip -q gradle-8.14-bin.zip
          ./gradle-8.14/bin/gradle wrapper --gradle-version=8.14 -p . 2>&1 || echo "Wrapper generation attempted"
          rm -rf gradle-8.14 gradle-8.14-bin.zip
          cd ..

      - name: Check Gradle wrapper
        run: ls -la android/gradle/wrapper/

      - name: Setup signing keystore
        if: secrets.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore
          ls -lh android/release.keystore

      - name: Build APK (signed)
        if: secrets.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          flutter build apk --release -v \
            --release-build-signing-keystore-path=android/release.keystore \
            --release-build-signing-keystore-password=${{ secrets.RELEASE_KEYSTORE_PASSWORD }} \
            --release-build-signing-key-alias=${{ secrets.RELEASE_KEY_ALIAS }} \
            --release-build-signing-key-password=${{ secrets.RELEASE_KEY_PASSWORD }} \
            2>&1 | tee build_apk.log
        continue-on-error: true

      - name: Build APK (unsigned)
        if: secrets.RELEASE_KEYSTORE_BASE64 == ''
        run: flutter build apk --release -v 2>&1 | tee build_apk.log
        continue-on-error: true

      - name: Build AAB (signed)
        if: secrets.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          flutter build appbundle --release -v \
            --release-build-signing-keystore-path=android/release.keystore \
            --release-build-signing-keystore-password=${{ secrets.RELEASE_KEYSTORE_PASSWORD }} \
            --release-build-signing-key-alias=${{ secrets.RELEASE_KEY_ALIAS }} \
            --release-build-signing-key-password=${{ secrets.RELEASE_KEY_PASSWORD }} \
            2>&1 | tee build_aab.log
        continue-on-error: true

      - name: Build AAB (unsigned)
        if: secrets.RELEASE_KEYSTORE_BASE64 == ''
        run: flutter build appbundle --release -v 2>&1 | tee build_aab.log
        continue-on-error: true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_apk.log
            build_aab.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/app/outputs/apk/release/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: Setup Python for Google Drive upload
        if: always()
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Google Drive dependencies
        if: always()
        run: |
          pip install google-auth google-auth-httplib2 google-api-python-client

      - name: Upload to Google Drive
        if: always()
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID || '1kqPMiEnGtF7sRNiYsds9_9YvuPsT1Rfu' }}
        run: python scripts/upload_to_drive.py
